services:
  service-downloader:
    build:
      context: ../../backend
      dockerfile: services/downloader/.cloud/docker/Dockerfile
      target: plugin-dev
      args:
        - PLUGINNAME=downloader
        - KIND=services
    image: codeclarityce/service-downloader-dev:latest
    restart: always
    deploy:
      replicas: 8
    volumes:
      - ../../backend:/codeclarity
      - ../../private:/private
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_started
      adminer:
        condition: service_started
    env_file:
      - ../../.cloud/env/.env.dev
    environment:
      # Literal value: `environment:` ${VAR} interpolation reads the host shell,
      # not the service's env_file.
      - DOWNLOAD_TIMEOUT_SECONDS=900

volumes:
  projects:
